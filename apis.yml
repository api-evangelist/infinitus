  note: >-
    Contract discovery moved this profile off "no API surface". The real product
    API host is api.infinitusai.com (a DIFFERENT registrable domain from the
    infinitus.ai marketing site), named by Infinitus' own knowledge base, with a
    gated REST /v1/ path and a gated GraphQL endpoint. A live OAuth-protected MCP
    server was discovered on www.infinitus.ai via RFC 9728/8414 well-known
    documents. No OpenAPI, no agent card, no first-party SDK.
