name: Infinitus
description: >-
  Infinitus Systems is a safety-first healthcare voice AI platform that automates
  outbound and inbound phone calls to patients, payors, and providers for clinical
  and administrative tasks including benefit verification, prior authorization,
  prescription follow-up, and patient engagement. Its products include AI Agents
  (autonomous call handling), AI Copilots (human-assisted tools), Studio (a no-code
  agent builder), and Lens (conversation analysis and real-time clinical risk
  detection), backed by a healthcare knowledge graph. Benefit verifications are
  submitted individually or in bulk through the customer portal, CSV upload, or a
  customer-gated REST and GraphQL API at api.infinitusai.com, with a packaged
  Salesforce Life Sciences Cloud, Health Cloud, and Agentforce integration.
  Infinitus operates no public developer portal and publishes no OpenAPI: every
  API endpoint requires an authenticated customer account. It is SOC 2 Type II
  certified and signs HIPAA Business Associate Agreements. The company is backed
  by GV and Kleiner Perkins.
