apis:
- aid: infinitus:platform-api
  name: Infinitus Platform API
  description: >-
    The customer-gated Infinitus backend API. Infinitus' own AI Agent Security
    Guide instructs customers to allowlist https://api.infinitusai.com on TCP 443
    for "portal and backend API access". Probing confirms two live surfaces on
    that host: a versioned REST path (GET /v1/tasks returns 401 Unauthorized) and
    a GraphQL endpoint (/graphql returns 401 to both GET and an introspection
    POST). Used to submit benefit verification, prior authorization, and
    prescription follow-up tasks individually or in bulk and to collect the
    results after an AI voice agent completes the payor call. No public OpenAPI,
    GraphQL SDL, or API reference is published; access requires a customer
    contract.
  humanURL: https://support.infinitus.ai/ikb/ai-agent-security-guide.md
  baseURL: https://api.infinitusai.com
